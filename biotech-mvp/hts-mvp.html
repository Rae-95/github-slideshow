<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DrugScan Pro — 超微量高通量药物筛选平台</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
    .gradient-hero { background: linear-gradient(145deg, #0c1829 0%, #0d2b4b 45%, #0a1e38 100%); }
    .well { width: 13px; height: 13px; border-radius: 50%; cursor: pointer;
            transition: transform .12s, box-shadow .12s; flex-shrink: 0; }
    .well:hover { transform: scale(1.6); position: relative; z-index: 20; }
    .card-lift { transition: box-shadow .2s, transform .2s; }
    .card-lift:hover { box-shadow: 0 12px 36px rgba(0,0,0,.1); transform: translateY(-2px); }
    .fade-in { animation: fadeIn .4s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .pill { display: inline-flex; align-items: center; border-radius: 9999px; padding: 2px 10px; font-size: 11px; font-weight: 600; }
    /* Scrollbar */
    .thin-scroll::-webkit-scrollbar { width: 4px; }
    .thin-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

<body class="bg-gray-50 text-gray-900">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ─────────────────────────────────────────────────────────
   Mock data: 384-well kinase-inhibitor screen
   Column 1 = positive control (ref inhibitor, ~95% inh)
   Column 24 = negative control (DMSO, ~2% inh)
   Hit rate ~1.3 % (matches realistic primary screen)
───────────────────────────────────────────────────────── */
const ROWS = 'ABCDEFGHIJKLMNOP'.split('');
const HIT_DEFS = [
  { id:'DSP-001', name:'化合物 #0847', ec50:0.23, maxInh:96, hill:1.8, type:'ATP竞争性抑制' },
  { id:'DSP-002', name:'化合物 #1203', ec50:0.78, maxInh:89, hill:1.5, type:'变构抑制剂' },
  { id:'DSP-003', name:'化合物 #2541', ec50:1.45, maxInh:82, hill:1.3, type:'ATP竞争性抑制' },
  { id:'DSP-004', name:'化合物 #3892', ec50:3.12, maxInh:78, hill:1.1, type:'底物竞争性抑制' },
  { id:'DSP-005', name:'化合物 #4671', ec50:0.52, maxInh:93, hill:1.7, type:'变构抑制剂' },
];

function mkRng(seed) {
  let s = seed >>> 0;
  return () => { s = (Math.imul(1664525, s) + 1013904223) >>> 0; return s / 0xffffffff; };
}
const rng = mkRng(0xdeadbeef);

function buildPlate() {
  const wells = [];
  let hitCursor = 0;
  ROWS.forEach((row, ri) => {
    for (let col = 1; col <= 24; col++) {
      const id = `${row}${col}`;
      let inh, type, cpd;
      if (col === 1) {
        inh = 91 + rng() * 8; type = 'pos';
        cpd = { name:'阳性对照 (Staurosporine)', type:'参考抑制剂', ec50:null };
      } else if (col === 24) {
        inh = rng() * 7; type = 'neg';
        cpd = { name:'阴性对照 (DMSO)', type:'溶剂对照', ec50:null };
      } else {
        const r = rng();
        if (hitCursor < HIT_DEFS.length && r < 0.014) {
          const h = HIT_DEFS[hitCursor++];
          inh = h.maxInh - rng() * 4; type = 'hit'; cpd = h;
        } else if (r < 0.042) {
          inh = 30 + rng() * 38; type = 'moderate';
          cpd = { name:`化合物 #${Math.floor(rng()*8999+1000)}`, type:'待确认', ec50:null };
        } else {
          inh = rng() * 18; type = 'inactive';
          cpd = { name:`化合物 #${Math.floor(rng()*8999+1000)}`, type:'无活性', ec50:null };
        }
      }
      wells.push({ id, row, col, ri, ci: col-1, inh: Math.round(inh*10)/10, type, cpd });
    }
  });
  return wells;
}

function wellColor(inh, type) {
  if (type === 'pos')  return '#ef4444';
  if (type === 'neg')  return '#94a3b8';
  if (inh >= 75) return `hsl(${(100-inh)*0.5|0}, 88%, 48%)`;
  if (inh >= 45) return `hsl(${30+(70-inh)*0.4|0}, 82%, 54%)`;
  if (inh >= 25) return 'hsl(48,72%,62%)';
  return '#cbd5e1';
}

/* ─────────────────────────────────────────────────────────
   Dose-Response Curve (4PL, pure SVG)
───────────────────────────────────────────────────────── */
function DRC({ cpd }) {
  const { ec50, maxInh, hill = 1.5 } = cpd;
  const W=300, H=190, PL=44, PB=36, PT=16, PR=14;
  const cW=W-PL-PR, cH=H-PT-PB;
  const logMin=-3, logMax=2;
  const pts = Array.from({length:80},(_,i)=>logMin+(logMax-logMin)*i/79);
  const y4pl = ld => (maxInh)/(1+Math.pow(ec50/Math.pow(10,ld), hill));
  const sx = ld => PL+(ld-logMin)/(logMax-logMin)*cW;
  const sy = y  => PT+cH-(y/100)*cH;
  const d = pts.map((ld,i)=>`${i?'L':'M'}${sx(ld).toFixed(1)},${sy(y4pl(ld)).toFixed(1)}`).join('');
  const ec50x = sx(Math.log10(ec50)), ec50y = sy(maxInh/2);
  const xTicks=[[-3,'0.001'],[-2,'0.01'],[-1,'0.1'],[0,'1'],[1,'10'],[2,'100']];
  const yTicks=[0,25,50,75,100];
  return (
    <svg width={W} height={H} className="overflow-visible">
      {yTicks.map(t=><line key={t} x1={PL} y1={sy(t)} x2={PL+cW} y2={sy(t)} stroke="#e2e8f0" strokeWidth="1"/>)}
      <line x1={PL} y1={PT} x2={PL} y2={PT+cH} stroke="#64748b" strokeWidth="1.5"/>
      <line x1={PL} y1={PT+cH} x2={PL+cW} y2={PT+cH} stroke="#64748b" strokeWidth="1.5"/>
      <path d={d} fill="none" stroke="#3b82f6" strokeWidth="2.5" strokeLinecap="round"/>
      <line x1={ec50x} y1={PT} x2={ec50x} y2={ec50y} stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="4,3"/>
      <line x1={PL} y1={ec50y} x2={ec50x} y2={ec50y} stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="4,3"/>
      <circle cx={ec50x} cy={ec50y} r={4} fill="#f59e0b"/>
      <text x={ec50x+6} y={ec50y-4} fontSize="9" fill="#d97706" fontWeight="600">EC₅₀={ec50}µM</text>
      {xTicks.map(([v,l])=><text key={v} x={sx(v)} y={PT+cH+14} textAnchor="middle" fontSize="9" fill="#64748b">{l}</text>)}
      {yTicks.map(t=><text key={t} x={PL-5} y={sy(t)+3} textAnchor="end" fontSize="9" fill="#64748b">{t}</text>)}
      <text x={PL+cW/2} y={H-1} textAnchor="middle" fontSize="9" fill="#475569">浓度 (µM)</text>
      <text x={10} y={PT+cH/2} textAnchor="middle" fontSize="9" fill="#475569"
        transform={`rotate(-90,10,${PT+cH/2})`}>抑制率 (%)</text>
    </svg>
  );
}

/* ─────────────────────────────────────────────────────────
   384-well Plate Heatmap
───────────────────────────────────────────────────────── */
function PlateMap({ wells, onSelect, sel }) {
  const wmap = useMemo(()=>Object.fromEntries(wells.map(w=>[w.id,w])),[wells]);
  return (
    <div>
      <div className="flex gap-[3px] mb-1 ml-[22px]">
        {Array.from({length:24},(_,i)=>(
          <div key={i} style={{width:13,fontSize:8,textAlign:'center',color:'#94a3b8',flexShrink:0}}>{i+1}</div>
        ))}
      </div>
      {ROWS.map(row=>(
        <div key={row} className="flex items-center gap-[3px] mb-[3px]">
          <div style={{width:18,fontSize:8,textAlign:'right',color:'#94a3b8',marginRight:2,flexShrink:0}}>{row}</div>
          {Array.from({length:24},(_,ci)=>{
            const w = wmap[`${row}${ci+1}`];
            if (!w) return null;
            const isSel = sel?.id === w.id;
            return (
              <div key={ci} className="well"
                style={{
                  background: wellColor(w.inh, w.type),
                  boxShadow: isSel ? '0 0 0 2px #fff,0 0 0 3.5px #3b82f6' : undefined,
                }}
                onClick={()=>onSelect(w)}
                title={`${w.id} · ${w.cpd.name} · 抑制率 ${w.inh}%`}
              />
            );
          })}
        </div>
      ))}
      <div className="flex flex-wrap gap-x-4 gap-y-1 mt-3">
        {[
          ['阳性对照','bg-red-500'],
          ['强命中 ≥75%','bg-orange-500'],
          ['中等活性 45–75%','bg-yellow-400'],
          ['弱活性 25–45%','bg-yellow-200'],
          ['无活性','bg-slate-300'],
        ].map(([l,c])=>(
          <div key={l} className="flex items-center gap-1">
            <div className={`w-2.5 h-2.5 rounded-full ${c}`}/>
            <span className="text-xs text-gray-400">{l}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────
   QC Stats
───────────────────────────────────────────────────────── */
function QCStats({ wells }) {
  const pos = wells.filter(w=>w.type==='pos').map(w=>w.inh);
  const neg = wells.filter(w=>w.type==='neg').map(w=>w.inh);
  const test = wells.filter(w=>w.type!=='pos'&&w.type!=='neg');
  const hits = wells.filter(w=>w.type==='hit');
  const mod  = wells.filter(w=>w.type==='moderate');
  const avg = a=>a.reduce((s,v)=>s+v,0)/a.length;
  const sd  = a=>{ const m=avg(a); return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/a.length); };
  const zp  = 1-3*(sd(pos)+sd(neg))/Math.abs(avg(pos)-avg(neg));
  const sb  = avg(pos)/avg(neg);
  const stats = [
    { l:"Z' 因子", v:zp.toFixed(3), ok:zp>0.5, sub:'质量标准 >0.5' },
    { l:'S/B 比值', v:sb.toFixed(1)+'×', ok:sb>5, sub:'信噪比 >5 为优' },
    { l:'命中率', v:(hits.length/test.length*100).toFixed(2)+'%', ok:true, sub:`${hits.length} 个强命中` },
    { l:'待确认', v:mod.length+'个', ok:true, sub:'需浓度梯度确认' },
    { l:'样品体积', v:'50 nL', ok:true, sub:'vs 传统 10 µL' },
    { l:'检测方法', v:'HTRF', ok:true, sub:'均相均相，无洗板' },
  ];
  return (
    <div className="grid grid-cols-2 gap-2.5">
      {stats.map(s=>(
        <div key={s.l} className={`p-3 rounded-xl border ${s.ok?'bg-green-50 border-green-200':'bg-yellow-50 border-yellow-200'}`}>
          <div className="text-xs text-gray-500">{s.l}</div>
          <div className="text-lg font-bold text-gray-900 mt-0.5">{s.v}</div>
          <div className="text-xs text-gray-400 mt-0.5">{s.sub}</div>
        </div>
      ))}
    </div>
  );
}

/* ─────────────────────────────────────────────────────────
   Hit List
───────────────────────────────────────────────────────── */
function HitList({ wells, onSelect, sel }) {
  const hits = useMemo(()=>
    wells.filter(w=>w.inh>=70&&w.type!=='pos').sort((a,b)=>b.inh-a.inh),
  [wells]);
  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <span className="text-sm font-semibold text-gray-700">命中化合物</span>
        <span className="pill bg-red-100 text-red-600">{hits.length} 个</span>
      </div>
      <div className="space-y-1.5 max-h-56 overflow-y-auto thin-scroll">
        {hits.map(w=>(
          <div key={w.id} onClick={()=>onSelect(w)}
            className={`p-2.5 rounded-lg border cursor-pointer transition-colors ${sel?.id===w.id?'border-blue-400 bg-blue-50':'border-gray-200 bg-white hover:border-blue-200'}`}>
            <div className="flex justify-between items-start">
              <div>
                <div className="text-sm font-medium text-gray-900 leading-tight">{w.cpd.name}</div>
                <div className="text-xs text-gray-400">{w.cpd.type} · {w.id}</div>
              </div>
              <div className="text-right ml-2">
                <div className="text-sm font-bold text-red-600">{w.inh}%</div>
                {w.cpd.ec50&&<div className="text-xs text-gray-400">IC₅₀ {w.cpd.ec50}µM</div>}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────
   Cost Calculator
───────────────────────────────────────────────────────── */
function CostCalc() {

  const trad = n * 8;     // ¥8/well traditional
  const ds   = n * 0.48;  // ¥0.48/well DrugScan

  return (
    <div className="bg-white rounded-2xl border border-gray-200 p-6">
      <h3 className="text-base font-bold text-gray-900 mb-4">成本对比计算器</h3>
      <label className="block text-sm text-gray-600 mb-1.5">
        化合物数量：<span className="font-bold text-blue-600">{n.toLocaleString()}</span> 个
      </label>
      <input type="range" min={1000} max={100000} step={1000} value={n}
        onChange={e=>setN(+e.target.value)}
        className="w-full accent-blue-600 mb-1"/>
      <div className="flex justify-between text-xs text-gray-400 mb-5">
        <span>1K</span><span>25K</span><span>50K</span><span>75K</span><span>100K</span>
      </div>
      <div className="grid grid-cols-2 gap-3 mb-3">
        <div className="bg-gray-50 rounded-xl p-3.5">
          <div className="text-xs text-gray-500 mb-1">传统 HTS（10 µL/孔）</div>
          <div className="text-2xl font-bold text-gray-700">
            ¥{trad>=10000?(trad/10000).toFixed(1)+'万':trad.toLocaleString()}
          </div>
          <div className="text-xs text-gray-400 mt-0.5">≈ ¥8/孔</div>
        </div>
        <div className="bg-blue-50 rounded-xl p-3.5 border border-blue-200">
          <div className="text-xs text-blue-600 font-medium mb-1">DrugScan Pro（50 nL/孔）</div>
          <div className="text-2xl font-bold text-blue-700">
            ¥{ds>=10000?(ds/10000).toFixed(1)+'万':ds.toLocaleString()}
          </div>
          <div className="text-xs text-blue-500 mt-0.5">≈ ¥0.48/孔</div>
        </div>
      </div>
      <div className="bg-green-50 border border-green-200 rounded-xl p-3.5 text-center">
        <div className="text-xs text-green-700 mb-0.5">节省成本</div>
        <div className="text-3xl font-bold text-green-600">
          ¥{save>=10000?(save/10000).toFixed(1)+'万':save.toLocaleString()}

        <div className="text-sm text-green-600 mt-0.5">较传统方案节省 <strong>{pct}%</strong></div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────
   Lead capture form
───────────────────────────────────────────────────────── */
function LeadForm() {
  const [f,setF] = useState({company:'',name:'',email:'',phone:'',need:'',lib:'',timeline:'',note:''});
  const [done,setDone] = useState(false);
  const [busy,setBusy] = useState(false);
  const submit = e => {
    e.preventDefault(); setBusy(true);
    setTimeout(()=>{ setBusy(false); setDone(true); }, 900);
  };
  if (done) return (
    <div className="text-center py-14 fade-in">
      <div className="text-5xl mb-4">✅</div>
      <div className="text-2xl font-bold text-gray-900 mb-2">申请已收到</div>
      <p className="text-gray-500">我们将在 2 个工作日内联系您，安排免费 PoC 评估</p>
    </div>
  );
  return (
    <form onSubmit={submit} className="max-w-2xl mx-auto">
      <div className="grid grid-cols-2 gap-4 mb-4">
        {[
          {k:'company',l:'公司 / 机构名称 *',ph:'例：某某生物技术有限公司',req:true},
          {k:'name',l:'联系人姓名 *',ph:'姓名',req:true},
          {k:'email',l:'邮箱 *',ph:'name@company.com',t:'email',req:true},
          {k:'phone',l:'联系电话',ph:'+86'},
        ].map(x=>(
          <div key={x.k}>
            <label className="block text-sm font-medium text-gray-700 mb-1">{x.l}</label>
            <input type={x.t||'text'} required={x.req} placeholder={x.ph}
              className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
              value={f[x.k]} onChange={e=>setF({...f,[x.k]:e.target.value})}/>
          </div>
        ))}
      </div>
      <div className="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">筛选需求类型 *</label>
          <select required className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
            value={f.need} onChange={e=>setF({...f,need:e.target.value})}>
            <option value="">请选择</option>
            <option value="kinase">靶点筛选（激酶 / GPCR / 离子通道）</option>
            <option value="cell">细胞表型筛选</option>
            <option value="enzyme">酶活性筛选</option>
            <option value="binding">均相亲和力筛选（TR-FRET / SPR替代）</option>
            <option value="other">其他（备注说明）</option>
          </select>
        </div>
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">化合物库规模</label>
          <select className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
            value={f.lib} onChange={e=>setF({...f,lib:e.target.value})}>
            <option value="">请选择</option>
            <option value="s">{'<'} 5,000 个</option>
            <option value="m">5,000 – 50,000 个</option>
            <option value="l">50,000 – 200,000 个</option>
            <option value="xl">自有化合物库（天然产物 / 中药提取物等）</option>
          </select>
        </div>
      </div>
      <div className="mb-4">
        <label className="block text-sm font-medium text-gray-700 mb-1">预计启动时间</label>
        <select className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
          value={f.timeline} onChange={e=>setF({...f,timeline:e.target.value})}>
          <option value="">请选择</option>
          <option value="1m">1 个月内</option>
          <option value="3m">1–3 个月</option>
          <option value="6m">3–6 个月</option>
          <option value="eval">先评估，暂无固定时间表</option>
        </select>
      </div>
      <div className="mb-6">
        <label className="block text-sm font-medium text-gray-700 mb-1">靶点 / 项目背景（选填）</label>
        <textarea rows={3}
          className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none resize-none"
          placeholder="描述靶点、疾病领域、现有 assay 条件，或需要我们协助开发均相检测方法"
          value={f.note} onChange={e=>setF({...f,note:e.target.value})}/>
      </div>
      <button type="submit" disabled={busy}
        className="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold text-base hover:bg-blue-700 disabled:opacity-60 transition-colors">
        {busy ? '提交中...' : '申请免费 PoC 评估 →'}
      </button>
      <p className="text-center text-xs text-gray-400 mt-3">信息仅用于项目对接，不对外共享</p>
    </form>
  );
}

/* ─────────────────────────────────────────────────────────
